<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own and run the hardware service -->
  <policy user="root">
    <allow own="org.kde.legionvantage.helper"/>
  </policy>
  <!-- Allow your standard user account to click the UI and send commands to it -->
  <policy context="default">
    <allow send_destination="org.kde.legionvantage.helper"/>
  </policy>
</busconfig>